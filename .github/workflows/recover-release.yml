name: Recover failed release publication

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated vMAJOR.MINOR.PATCH tag
        required: true
        type: string
      tag_object_sha:
        description: Original annotated tag object SHA from the trusted release checkout
        required: true
        type: string
      source_run_id:
        description: First failed Desktop tag workflow whose build jobs all succeeded
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate immutable tag and source artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact_ids: ${{ steps.source.outputs.artifact_ids }}
      commit: ${{ steps.source.outputs.commit }}
      tag_object: ${{ steps.source.outputs.tag_object }}
    steps:
      - name: Require dispatch from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
        run: test "$DISPATCH_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate failed tag workflow, annotated tag, jobs and artifacts
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          TAG_OBJECT_SHA: ${{ inputs.tag_object_sha }}
        run: |
          set -euo pipefail
          python scripts/release_recovery.py \
            --repository "$REPOSITORY" --tag "$RELEASE_TAG" \
            --run-id "$SOURCE_RUN_ID" --tag-object "$TAG_OBJECT_SHA" \
            --github-output >> "$GITHUB_OUTPUT"
      - name: Record original artifact container digests
        env:
          ARTIFACT_DIGESTS: ${{ steps.source.outputs.artifact_digests }}
          BRANCH_RUN_ID: ${{ steps.source.outputs.branch_run_id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          {
            echo "Confirmed branch run: $BRANCH_RUN_ID"
            echo "Confirmed failed tag run: $SOURCE_RUN_ID"
            echo 'Original Actions artifact container digests:'
            echo '```json'
            echo "$ARTIFACT_DIGESTS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish validated immutable tag artifacts
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release-refs/tags/${{ inputs.release_tag }}
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: release-source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: recovery-tools
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag }}
          path: release-source
          persist-credentials: false
      - name: Verify the checked-out release source
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - name: Rebuild generated Local SDK inputs for exact APK validation
        run: |
          (cd crates/pi_local && npm ci --ignore-scripts && bun run build)
          (cd backend/durable && npm ci --ignore-scripts --omit=dev)
          python experiments/bun-embedding/build_local.py
          git diff --exit-code
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_ids }}
          path: ${{ runner.temp }}/release
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Verify desktop packages/helpers, bundled Local APK and runtime/relink archives
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # Run the reviewed recovery validator from main against the tag's source tree.
          cp ../recovery-tools/scripts/release_desktop.py scripts/release_desktop_recovery.py
          python scripts/release_desktop_recovery.py --tag "$RELEASE_TAG" \
            --directory "$RUNNER_TEMP/release" --verify-android-signer
      - name: Publish and verify the previously built release artifacts
        env:
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag_type="$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.type)"
          tag_object="$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
          [[ "$tag_type" == tag && "$tag_object" == "$EXPECTED_TAG_OBJECT" ]]
          tag_commit="$(gh api "repos/$REPOSITORY/git/tags/$tag_object" --jq .object.sha)"
          [[ "$tag_commit" == "$EXPECTED_COMMIT" ]]
          if response="$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1)"; then
            echo "::error::Release $RELEASE_TAG now exists; refusing to overwrite it"
            exit 1
          elif [[ "$response" != *"HTTP 404"* ]]; then
            echo "::error::Could not verify that release $RELEASE_TAG is absent: $response"
            exit 1
          fi
          notes="docs/releases/$RELEASE_TAG.md"
          test -s "$notes" || { echo "::error::Missing release notes: $notes"; exit 1; }
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/release/* --verify-tag \
            --repo "$REPOSITORY" --title "$RELEASE_TAG" --notes-file "$notes"
          python ../recovery-tools/scripts/verify_published_release.py \
            --repository "$REPOSITORY" --tag "$RELEASE_TAG" \
            --commit "$EXPECTED_COMMIT" --tag-object "$EXPECTED_TAG_OBJECT" \
            --directory "$RUNNER_TEMP/release"
