name: Desktop
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_TARGET_DIR: target
  ZED_REVISION: 5becf8b5910fd538ccc5489e8edd3fde32917fad

jobs:
  checks:
    name: Tests and lints (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: pi-desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: pi-desktop
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          repository: zed-industries/zed
          ref: ${{ env.ZED_REVISION }}
          path: zed
      - name: Apply reviewed GPUI Android lifecycle and tracing patch
        run: git -C ../zed apply ../pi-desktop/packaging/zed.patch
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang lld libclang-dev libasound2-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev libssl-dev mesa-vulkan-drivers xvfb xauth xdotool xclip imagemagick tesseract-ocr fonts-dejavu-extra
          echo 'RUSTFLAGS=-C link-arg=-fuse-ld=lld' >> "$GITHUB_ENV"
          python -m pip install Pillow==12.1.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: pi-desktop
          key: checks
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - name: Build and validate experimental Local adapters (offline)
        run: |
          (cd crates/pi_local && npm ci --ignore-scripts && bun run build)
          (cd backend/durable && npm ci --ignore-scripts)
          python experiments/bun-embedding/build_local.py
          (cd backend/durable && bun run check && bun test)
          bun test backend/durable/android/native-models.test.js backend/durable/android/local.test.js
          cargo fmt --manifest-path crates/pi_local/Cargo.toml -- --check
          cargo test --locked --manifest-path crates/pi_local/Cargo.toml
          cargo clippy --locked --manifest-path crates/pi_local/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked -p pi_android --features local-backend --all-targets --no-deps -- -D warnings
          cargo clippy --locked -p pi_android --features bun-backend-test --all-targets --no-deps -- -D warnings
          cargo test --locked -p pi_android --features bun-backend-test
          python -m unittest discover -s experiments/bun-embedding -p 'test_*_tooling.py' -v
      - name: Verify generated inputs and lockfiles are current
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          python scripts/rust_notices.py --check
          git diff --exit-code
      # Do not traverse/format the sibling Zed checkout.
      - name: Format
        run: cargo fmt -p pi_visual -p pi_visual_ui -p pi_markdown -p pi_core -p pi_remote -p pi_android -p gpui_android -p pi_editor -p pi_jj -p pi_lsp_bridge -p pi_settings -p terminal -p pi_terminal -p pi_terminal_mobile -p pi-desktop -- --check
      - name: Rust tests
        run: cargo test --locked --workspace
      - name: Android scheduling UI tests (sample only)
        run: cargo test --locked -p pi_android --features ui-test
      - name: Scheduler emulator harness safety tests
        run: |
          python -m unittest discover -s crates/pi_android/scripts -p 'test_*_tooling.py' -v
          python -m unittest discover -s crates/pi_android/scripts -p 'test_trace_capture.py' -v
      # These test-support features must not join the workspace build.
      - name: Language-server bridge tests
        run: cargo test --locked -p pi_lsp_bridge --features fake-lsp
      - name: Lints
        run: |
          cargo clippy --locked --workspace --all-targets --no-deps -- -D warnings
          cargo clippy --locked -p pi_visual_ui --all-targets --no-deps -- -D warnings
          cargo clippy --locked -p pi_android --features ui-test --all-targets --no-deps -- -D warnings
          cargo clippy --locked -p pi_lsp_bridge --features fake-lsp --all-targets --no-deps -- -D warnings
      # The pi that release builds embed: the desktop extension against it (no
      # provider calls), and the desktop with it embedded.
      - name: Built-in pi
        run: |
          python scripts/fetch_pi.py --platform linux-x64 --out "$RUNNER_TEMP/pi"
          PI_DESKTOP_TEST_PI="$RUNNER_TEMP/pi/linux-x64/pi" cargo test --locked -p pi_core --test transport -- --ignored
          PI_DESKTOP_BACKEND_ARCHIVE="$RUNNER_TEMP/pi/pi-linux-x64.tar.gz" \
            cargo clippy --locked -p pi-desktop --features bundled-backend --all-targets --no-deps -- -D warnings
      - name: Packaging and release-policy tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Debug build for native UI checks
        run: cargo build --locked -p pi-desktop
      - name: Xvfb screen validation
        run: |
          xvfb-run -a -s '-screen 0 1440x900x24' bash scripts/capture-first-screen.sh
          python scripts/validate-screens.py
          python scripts/compare-thread-study.py
          xvfb-run -a -s '-screen 0 1440x900x24' bash scripts/capture-tool-selection.sh
          xvfb-run -a -s '-screen 0 1440x900x24' bash scripts/capture-process-scrollbar.sh
          xvfb-run -a -s '-screen 0 1440x1200x24' bash scripts/capture-visualize.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-validation
          path: pi-desktop/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  native:
    name: Package / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, binary: pi-desktop, pi: linux-x64 }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, binary: pi-desktop, pi: linux-arm64 }
          - { name: macos-arm64, os: macos-14, target: aarch64-apple-darwin, binary: pi-desktop, pi: darwin-arm64 }
          - { name: windows-amd64, os: windows-2022, target: x86_64-pc-windows-msvc, binary: pi-desktop.exe, pi: windows-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: pi-desktop
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: pi-desktop
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          repository: zed-industries/zed
          ref: ${{ env.ZED_REVISION }}
          path: zed
      - name: Apply reviewed GPUI Android lifecycle and tracing patch
        run: git -C ../zed apply ../pi-desktop/packaging/zed.patch
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      # npm collects the licenses of the npm packages compiled into pi.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_desktop.py --tag "$RELEASE_TAG"
        shell: bash
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang lld libclang-dev libasound2-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev libssl-dev
          echo 'RUSTFLAGS=-C link-arg=-fuse-ld=lld' >> "$GITHUB_ENV"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clang = 'C:\Program Files\LLVM\bin'
          if (!(Test-Path "$clang/libclang.dll")) { throw 'Hosted runner is missing LLVM/libclang' }
          "LIBCLANG_PATH=$clang" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: pi-desktop
          key: release-${{ matrix.target }}
      # pi's release binary, built into the executable (the bundled-backend
      # feature): see docs/architecture.md.
      - name: Built-in pi
        shell: bash
        run: python scripts/fetch_pi.py --platform ${{ matrix.pi }} --out "$RUNNER_TEMP/pi" --notices
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: runner.os != 'Windows'
        with:
          bun-version: '1.4.3'
      - name: Durable standalone prototype and crash recovery (no model calls)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd backend/durable
          npm ci --ignore-scripts
          npm run check
          bun test
          bun run build
          bun build test/fixture.ts --compile --outfile ../../artifacts/durable/pi-desktop-durable-fixture
          bun build test/javascript-crash-fixture.ts --compile --outfile ../../artifacts/durable/pi-desktop-javascript-fixture
          PI_JAVASCRIPT_TEST_RUNNER=../../artifacts/durable/pi-desktop-javascript-fixture bun test test/javascript-recovery.test.ts
          bun build test/standalone-auth.ts --compile --minify --outfile ../../artifacts/durable/pi-desktop-durable-auth-probe
          cd ../..
          PI_DESKTOP_TEST_DURABLE_RUNNER="$PWD/artifacts/durable/pi-desktop-durable-fixture" \
            cargo test --locked -p pi_remote --test durable -- --ignored
          PI_DESKTOP_TEST_DURABLE_RUNNER="$PWD/artifacts/durable/pi-desktop-durable-fixture" \
            cargo test --locked -p pi_remote --test schedules -- --ignored
          PI_DESKTOP_TEST_DURABLE_PRODUCTION="$PWD/artifacts/durable/pi-desktop-durable" \
          PI_DESKTOP_TEST_DURABLE_AUTH_PROBE="$PWD/artifacts/durable/pi-desktop-durable-auth-probe" \
            cargo test --locked -p pi_remote --test durable_auth -- --ignored
          PI_DESKTOP_DURABLE_BINARY="$PWD/artifacts/durable/pi-desktop-durable" \
            cargo check --locked -p pi_remote --features bundled-durable
      - name: Native headless helper tests (no model calls)
        run: cargo test --locked -p pi_remote
      # The SSH helper carries the durable engine built above, so durable
      # sessions (and Pi for Android) work on a computer with just the helper.
      # Windows has no durable engine yet.
      # Not bash: on Windows, Git's /usr/bin/link would shadow MSVC's link.exe.
      - name: Native release build
        env:
          PI_DESKTOP_BACKEND_ARCHIVE: ${{ runner.temp }}/pi/pi-${{ matrix.pi }}.tar.gz
          PI_DESKTOP_RELEASE_REPOSITORY: ${{ github.repository }}
          PI_DESKTOP_DURABLE_BINARY: ${{ github.workspace }}/pi-desktop/artifacts/durable/pi-desktop-durable
        run: cargo build --locked --release -p pi-desktop -p pi_remote --target ${{ matrix.target }} --features pi-desktop/bundled-backend,pi_remote/bundled-backend${{ runner.os != 'Windows' && ',pi_remote/bundled-durable' || '' }}
      - name: Package only distributable files
        run: python scripts/package_desktop.py --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.binary }} --notices ${{ runner.temp }}/pi/pi-notices.txt
      - name: Package standalone SSH helper
        shell: bash
        run: |
          suffix=''
          if [[ '${{ runner.os }}' == 'Windows' ]]; then suffix='.exe'; fi
          python scripts/package_remote.py --target ${{ matrix.target }} --binary "target/${{ matrix.target }}/release/pi-desktop-remote${suffix}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pi-desktop-${{ matrix.name }}
          path: pi-desktop/dist/
          if-no-files-found: error
          retention-days: 14

  bun-runtime:
    name: Build / embedded Bun Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: runtime-cache
        with:
          path: ${{ runner.temp }}/bun-runtime-out
          key: bun-android-arm64-1.4.3-ndk29-llvm23-${{ hashFiles('experiments/bun-embedding/native/**', 'experiments/bun-embedding/prepare.py', 'experiments/bun-embedding/relink.py', 'experiments/bun-embedding/build_runtime.py', 'licenses/MPL-2.0.txt') }}
      - name: Make room for the source/object build (hosted runner only)
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          bun-version: '1.4.3'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          toolchain: nightly-2026-09-15
          components: rust-src
          targets: aarch64-linux-android
      - name: Install LLVM 23 and pinned Android NDK
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /usr/share/keyrings/llvm.asc >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main' | sudo tee /etc/apt/sources.list.d/llvm23.list
          sudo apt-get update
          sudo apt-get install -y clang-23 lld-23 llvm-23 llvm-23-dev nasm cmake ninja-build pkg-config libssl-dev
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.14206865'
      - name: Source-build, relink and preserve LGPL relink inputs
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          python3 experiments/bun-embedding/build_runtime.py \
            --work-dir "$RUNNER_TEMP/bun-build" --ndk "$ANDROID_HOME/ndk/29.0.14206865" \
            --llvm /usr/lib/llvm-23 --out-dir "$RUNNER_TEMP/bun-runtime-out" --jobs 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pi-desktop-bun-android-arm64
          path: ${{ runner.temp }}/bun-runtime-out/*.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  android:
    name: Package / android-arm64
    needs: bun-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: pi-desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: pi-desktop
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          repository: zed-industries/zed
          ref: ${{ env.ZED_REVISION }}
          path: zed
      - name: Apply reviewed GPUI Android lifecycle and tracing patch
        run: git -C ../zed apply ../pi-desktop/packaging/zed.patch
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: pi-desktop
          key: android
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pi-desktop-bun-android-arm64
          path: ${{ runner.temp }}/bun-runtime
      - name: Prepare bundled Local runtime and SDK
        run: |
          mkdir "$RUNNER_TEMP/bun-runtime/extracted"
          tar -xzf "$RUNNER_TEMP/bun-runtime/pi-bun-android-arm64-runtime.tar.gz" -C "$RUNNER_TEMP/bun-runtime/extracted"
          (cd crates/pi_local && npm ci --ignore-scripts)
          (cd backend/durable && npm ci --ignore-scripts --omit=dev)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.14206865'
      # The runner's Android SDK has the platform, build-tools and NDK the
      # builder needs. Releases are signed with the repository's key, so a new
      # version installs over the last; other builds use a throwaway debug key.
      - name: Build the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore=''
          cleanup_keystore() { [[ -z "$keystore" ]] || rm -f "$keystore"; }
          trap cleanup_keystore EXIT
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            keystore="$RUNNER_TEMP/release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
            export ANDROID_KEYSTORE="$keystore"
          elif [[ '${{ github.ref }}' == refs/tags/v* ]]; then
            echo '::error::Set the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets to sign release APKs'
            exit 1
          else
            echo '::warning::No ANDROID_KEYSTORE_BASE64 secret; signing with a debug key'
          fi
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/29.0.14206865"
          export PI_ANDROID_BUN_LIBRARY="$(find "$RUNNER_TEMP/bun-runtime/extracted" -name libbunembeddingpoc.so -type f)"
          test -f "$PI_ANDROID_BUN_LIBRARY"
          python crates/pi_android/scripts/build_apk.py --out dist/pi-android-arm64.apk
          cleanup_keystore
          keystore=''
          unset ANDROID_KEYSTORE ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs dist/pi-android-arm64.apk | tee "$RUNNER_TEMP/apk-signature.txt"
          if [[ '${{ github.ref }}' == refs/tags/v* ]]; then
            expected='4b1d0ec031843d23e95f0e4a2e70125241b5e80041bdb1caecceac99a9774e71'
            actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p; s/^V[0-9.]* Signer: certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt" | head -1)"
            [[ "$actual" == "$expected" ]] || {
              echo "::error::Release APK signer $actual does not match the pinned v0.0.19 update signer"
              exit 1
            }
          fi
          python scripts/release_desktop.py --tag "v$(python -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')" --android-apk dist/pi-android-arm64.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pi-desktop-android-arm64
          path: pi-desktop/dist/pi-android-arm64.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish / ${{ github.ref_name }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checks, native, android, bun-runtime]
    runs-on: ubuntu-24.04
    concurrency:
      group: release-${{ github.ref }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pi-desktop-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Rebuild generated Local SDK inputs for exact APK validation
        run: |
          (cd crates/pi_local && npm ci --ignore-scripts && bun run build)
          (cd backend/durable && npm ci --ignore-scripts --omit=dev)
          python experiments/bun-embedding/build_local.py
      - name: Verify desktop packages/helpers, bundled Local APK and runtime/relink archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/release_desktop.py --tag "$RELEASE_TAG" \
            --directory "$RUNNER_TEMP/release" --verify-android-signer
      # Existing releases/assets are immutable; recovery uses recover-release.yml.
      - name: Publish GitHub release
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_type="$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.type)"
          tag_object="$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
          [[ "$tag_type" == tag ]]
          tag_commit="$(gh api "repos/$REPOSITORY/git/tags/$tag_object" --jq .object.sha)"
          [[ "$tag_commit" == "$EXPECTED_COMMIT" ]]
          if response="$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1)"; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to modify it"
            exit 1
          elif [[ "$response" != *"HTTP 404"* ]]; then
            echo "::error::Could not verify that release $RELEASE_TAG is absent: $response"
            exit 1
          fi
          notes="docs/releases/$RELEASE_TAG.md"
          test -s "$notes" || { echo "::error::Missing release notes: $notes"; exit 1; }
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/release/* --verify-tag \
            --repo "$REPOSITORY" --title "$RELEASE_TAG" --notes-file "$notes"
          python scripts/verify_published_release.py \
            --repository "$REPOSITORY" --tag "$RELEASE_TAG" \
            --commit "$EXPECTED_COMMIT" --tag-object "$tag_object" \
            --directory "$RUNNER_TEMP/release"
