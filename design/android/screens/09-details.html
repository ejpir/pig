<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>09 · Session details</title>
<link rel="stylesheet" href="phone.css">
<style>
  .meter { height:8px;border-radius:4px;background:var(--raised);overflow:hidden;margin-top:8px }
  .meter span { display:block;height:100%;width:31%;background:var(--accent);border-radius:4px }
  .stat { flex:1;padding:12px 14px }.stat+.stat{border-left:1px solid var(--line)}
  .stat b{display:block;font-size:18px;margin-top:2px}.disclosure{height:52px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);font-size:15px}
</style></head><body>
<div class="phone"><main class="content" data-frag="done"></main><div class="scrim"></div>
  <div class="sheet" style="height:770px">
    <div class="handle"></div><div class="row"><span style="font-size:20px;font-weight:600" class="grow">Details</span><span class="tap" style="margin-right:-12px"><i data-i="x"></i></span></div>
    <div class="card" style="padding:14px;margin-top:8px">
      <div style="font-size:18px;font-weight:600">Qwen signatures</div><div class="hint">pi · studio-mac</div>
      <div class="row gap8" style="margin-top:10px"><span class="badge live">14 turns</span><span class="badge" style="background:var(--raised)">2 files</span></div>
    </div>
    <div class="row" style="margin-top:16px;align-items:baseline"><span class="label grow">Context</span><span class="hint">31% · 62k tokens</span></div>
    <div class="meter"><span></span></div><div class="hint" style="margin-top:7px">Auto-compaction is on.</div>
    <div class="card row" style="margin-top:14px;align-items:stretch">
      <div class="stat"><span class="label">Cost</span><b>$0.41</b></div><div class="stat"><span class="label">Turns</span><b>14</b></div><div class="stat"><span class="label">Files</span><b>2</b></div>
    </div>
    <span class="btn wide small" style="margin-top:12px"><i data-i="diff" class="sm"></i>Review 2 changed files</span>
    <div style="margin-top:16px">
      <div class="disclosure"><span class="grow">Run history</span><span class="hint">14 turns</span><i data-i="chev-r" class="sm faint"></i></div>
      <div class="disclosure"><span class="grow">Active tools</span><span class="hint">7</span><i data-i="chev-r" class="sm faint"></i></div>
      <div class="disclosure"><span class="grow">jj file history</span><span class="hint">Open</span><i data-i="chev-r" class="sm faint"></i></div>
      <div class="disclosure"><span class="grow">Technical</span><span class="hint ell" style="max-width:150px">Opus 5.5 · High</span><i data-i="chev-r" class="sm faint"></i></div>
    </div>
  </div>
</div><script src="fragments.js"></script><script src="phone.js"></script></body></html>
