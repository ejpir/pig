<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>10 A page Pi made</title>
<link rel="stylesheet" href="../next2.css">
<style>
  .poster { height: 232px; background: #05070d url("aurora.jpg") center 38% / cover no-repeat; }
</style></head>
<body>
<div class="phone">
  <main class="content">
    <div class="bar">
      <span class="tap"><i data-i="back"></i></span>
      <div class="name"><b>Aurora</b><span>Done in 0:54 in demo</span></div>
      <span class="tap"><i data-i="info"></i></span>
      <span class="tap"><i data-i="dots"></i></span>
    </div>
    <div class="scroll col g24" style="padding-top:8px">
      <div class="you">Make me something cool to look at</div>
      <div>
        <div class="run"><b class="edit" style="width:274px"></b><b class="hand" style="width:94px"></b></div>
        <div class="times"><span style="width:274px">0:40</span><span style="width:94px">0:14</span></div>
      </div>
      <p class="pi q">An aurora over a starfield. Touch it to stir the sky.</p>
      <div class="card">
        <div class="poster"></div>
        <div class="row g8" style="padding:12px 12px 12px 16px">
          <div class="grow"><div class="strong">Aurora</div><div class="cmd muted">aurora.html</div></div>
          <span class="btn sm quiet" style="padding:0 12px">Source</span>
          <span class="btn sm primary">Open</span>
        </div>
      </div>
    </div>
    <div class="dock">
      <div class="composer">
        <div class="draft ph">Ask for a change…</div>
        <div class="tools"><span class="tap"><i data-i="clip"></i></span>
          <span class="control">Opus 5.5<i data-i="chev-d"></i></span><span class="control">High<i data-i="chev-d"></i></span>
          <span class="grow"></span><span class="send off"><i data-i="send"></i></span></div>
      </div>
    </div>
  </main>
</div>
<script src="../next2.js"></script>
</body></html>
