<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>13 Computers</title>
<link rel="stylesheet" href="../next2.css"></head>
<body>
<div class="phone">
  <main class="content" data-frag="home">
    <div class="scrim"></div>
    <div class="sheet">
      <div class="handle"></div>
      <div class="heading">Computers</div>
      <div class="rows" style="margin-top:8px">
        <div class="r64">
          <i data-i="computer" class="muted"></i>
          <div class="grow"><div class="strong">studio-mac</div><div class="small ell" style="margin-top:2px">nick@studio-mac.local</div></div>
          <div class="small" style="text-align:right">3 working<br><span style="color:var(--green)">Connected</span></div>
        </div>
        <div class="r64">
          <i data-i="server" class="muted"></i>
          <div class="grow"><div class="strong">build-box</div><div class="small ell" style="margin-top:2px">dev@10.0.4.12</div></div>
          <span class="btn sm">Connect</span>
        </div>
        <div class="r56" style="color:var(--accent)"><i data-i="plus"></i><span class="grow strong">Pair another computer</span></div>
      </div>
      <div class="rule" style="margin:8px calc(-1 * var(--g)) 0"></div>
      <div class="rows">
        <div class="r56"><i data-i="spark" class="muted"></i><span class="grow">Try the sample sessions</span><i data-i="chev-r" class="sm faint"></i></div>
        <div class="r56"><i data-i="settings" class="muted"></i><span class="grow">Settings</span><i data-i="chev-r" class="sm faint"></i></div>
      </div>
    </div>
  </main>
</div>
<script src="../frags.js"></script><script src="../next2.js"></script>
</body></html>
