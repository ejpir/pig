<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>03 · New session</title>
<link rel="stylesheet" href="../next.css">
<style>
  .starts { display: flex; gap: 8px; margin: 0 calc(-1 * var(--g)); padding: 0 var(--g); overflow: hidden; }
  .sheet .composer .draft { min-height: 66px; }
</style></head>
<body>
<div class="phone">
  <main class="content" data-frag="home">
    <div class="scrim"></div>
    <div class="sheet" style="padding-bottom:12px">
      <div class="handle"></div>
      <div class="row g12">
        <h2 class="headline grow">What should we change?</h2>
      </div>
      <div class="row g8" style="margin-top:12px">
        <span class="chip"><i data-i="folder"></i>pi<span class="faint">· studio-mac</span><i data-i="chev-d"></i></span>
        <span class="meta">~/repos/pi · jj history on</span>
      </div>
      <div class="composer" style="margin:16px -8px 0">
        <div class="draft">Add jitter to the streaming retry backoff so parallel sessions don't retry in lockstep<span class="caret"></span></div>
        <div class="tools">
          <span class="tap"><i data-i="clip"></i></span>
          <span class="tap" style="width:40px"><i data-i="slash"></i></span>
          <span class="control">Opus 5.5<i data-i="chev-d"></i></span>
          <span class="control">High<i data-i="chev-d"></i></span>
          <span class="grow"></span>
          <span class="send"><i data-i="send"></i></span>
        </div>
      </div>
      <div class="starts" style="margin-top:12px">
        <span class="chip sm">Review local changes</span>
        <span class="chip sm">Explain this project</span>
        <span class="chip sm"><span class="mono">/fix-tests</span></span>
        <span class="chip sm">Write a test</span>
      </div>
    </div>
  </main>
  <div class="kb" data-kb="lockstep,lockstep.,locks"></div>
</div>
<script src="../frags.js"></script><script src="../next.js"></script>
</body></html>
