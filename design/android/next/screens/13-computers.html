<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>13 · Computers</title>
<link rel="stylesheet" href="../next.css"></head>
<body>
<div class="phone">
  <main class="content" data-frag="home">
    <div class="scrim"></div>
    <div class="sheet" style="padding-bottom:12px">
      <div class="handle"></div>
      <div class="t4">Computers</div>
      <div class="list" style="margin-top:8px">
        <div class="item">
          <span class="tile" style="--hue:var(--accent)"><i data-i="computer"></i></span>
          <div class="grow"><div class="t">studio-mac</div><div class="meta ell" style="margin-top:2px">nick@studio-mac.local · 3 sessions active</div></div>
          <i data-i="check" style="color:var(--accent)"></i>
        </div>
        <div class="item">
          <span class="tile" style="--hue:var(--muted)"><i data-i="server"></i></span>
          <div class="grow"><div class="t">build-box</div><div class="meta ell" style="margin-top:2px">dev@10.0.4.12 · not connected</div></div>
          <span class="btn sm">Connect</span>
        </div>
        <div class="item one" style="color:var(--accent)">
          <span class="tile" style="--hue:var(--accent);background:transparent;border:1.5px dashed color-mix(in srgb,var(--accent) 45%,transparent)"><i data-i="plus"></i></span>
          <span class="grow strong">Pair another computer</span>
        </div>
      </div>
      <div class="hair" style="margin:8px calc(-1 * var(--g)) 0"></div>
      <div class="list">
        <div class="item one"><span class="lead"><i data-i="spark" class="muted"></i></span><span class="grow">Sample sessions</span><span class="meta">no computer needed</span></div>
        <div class="item one"><span class="lead"><i data-i="settings" class="muted"></i></span><span class="grow">Settings</span><i data-i="chev-r" class="sm faint"></i></div>
      </div>
    </div>
  </main>
</div>
<script src="../frags.js"></script><script src="../next.js"></script>
</body></html>
