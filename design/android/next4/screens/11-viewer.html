<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>11 Page viewer</title>
<link rel="stylesheet" href="../next4.css">
<style>
  .page { flex: 1; min-height: 0; background: #05070d url("aurora-full.jpg") center top / cover no-repeat; }
  .tools-bar { height: 64px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-top: 1px solid var(--line); }
  .seg { flex: 1; height: 40px; display: flex; padding: 4px; border-radius: 20px; background: var(--panel); }
  .seg span { flex: 1; display: flex; align-items: center; justify-content: center; border-radius: 16px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .seg span.on { background: var(--composer); color: var(--text); box-shadow: 0 1px 2px rgba(37,47,61,.12); }
</style></head>
<body>
<div class="phone">
  <main class="content">
    <div class="page"></div>
    <div class="tools-bar">
      <span class="tap"><i data-i="x"></i></span>
      <div class="seg"><span class="on">Page</span><span>Source</span></div>
      <span class="tap"><i data-i="refresh"></i></span>
    </div>
  </main>
</div>
<script src="../next4.js"></script>
</body></html>
