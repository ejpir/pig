<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>01 Choose a project</title>
<link rel="stylesheet" href="../../next4/next4.css"><link rel="stylesheet" href="../projects.css"></head>
<body>
<div class="phone">
  <main class="content" data-under="home">
    <div class="sheet" style="top:40px;padding-bottom:0">
      <div class="handle"></div>
      <div class="row">
        <div class="grow"><div class="t4">Projects</div><div class="meta" style="margin-top:4px">on studio-mac</div></div>
        <span class="tap" style="margin-right:-12px"><i data-i="x"></i></span>
      </div>
      <div class="search" style="margin-top:16px"><i data-i="search"></i>Find a folder or file, or type a path</div>
      <div class="col" style="flex:1;min-height:0;overflow:hidden">
        <div class="label" style="margin-top:20px">Recent</div>
        <div class="list" style="margin-top:4px">
          <div class="item"><i data-i="folder" style="color:var(--accent)"></i><div class="grow"><div class="t">pi</div><div class="meta" style="margin-top:2px">~/repos/pi · 3 sessions</div></div><i data-i="check" style="color:var(--accent)"></i></div>
          <div class="item"><i data-i="folder" class="muted"></i><div class="grow"><div class="t">zed</div><div class="meta" style="margin-top:2px">~/repos/zed · yesterday</div></div></div>
        </div>
        <div class="row" style="margin-top:20px">
          <span class="label grow">On studio-mac</span>
          <span class="chip sm"><i data-i="eye"></i>Hidden</span>
        </div>
        <div class="crumbs"><span>~</span><i data-i="chev-r"></i><span class="here">repos</span></div>
        <div class="tree">
          <div class="node project"><span class="roll"><i data-i="chev-r"></i></span><i data-i="folder"></i><span class="name">minivm</span><span class="tag">git</span></div>
          <div class="node project picked"><span class="roll"><i data-i="chev-d"></i></span><i data-i="folder"></i><span class="name">pi</span><span class="tag">git</span></div>
          <div class="node" style="--d:1"><span class="guide" style="left:16px"></span><span class="roll"><i data-i="chev-r"></i></span><i data-i="folder"></i><span class="name">apps</span></div>
          <div class="node" style="--d:1"><span class="guide" style="left:16px"></span><span class="roll"><i data-i="chev-r"></i></span><i data-i="folder"></i><span class="name">packages</span></div>
          <div class="node file" style="--d:1"><span class="guide" style="left:16px"></span><span class="roll none"></span><i data-i="file"></i><span class="name">README.md</span><span class="tag">4 KB</span></div>
          <div class="node project"><span class="roll"><i data-i="chev-r"></i></span><i data-i="folder"></i><span class="name">zed</span><span class="tag">git</span></div>
          <div class="node"><span class="roll"><i data-i="chev-r"></i></span><i data-i="folder"></i><span class="name">scratch</span></div>
        </div>
      </div>
      <div class="dock" style="margin:0 calc(-1 * var(--g));padding:12px var(--g) 12px;border-top:1px solid var(--line)">
        <span class="btn primary wide"><i data-i="plus"></i>New session in pi</span>
      </div>
    </div>
  </main>
</div>
<script src="../frag.js"></script><script src="../../next4/next4.js"></script>
</body></html>
