<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>05 Find and go to</title>
<link rel="stylesheet" href="../../next4/next4.css"><link rel="stylesheet" href="../projects.css"></head>
<body>
<div class="phone">
  <main class="content" data-under="home">
    <div class="sheet" style="top:40px;padding-bottom:12px">
      <div class="handle"></div>
      <div class="row">
        <div class="grow"><div class="t4">Projects</div><div class="meta" style="margin-top:4px">on studio-mac</div></div>
        <span class="tap" style="margin-right:-12px"><i data-i="x"></i></span>
      </div>
      <div class="search" style="margin-top:16px;background:var(--composer);border:1px solid var(--line-strong)"><i data-i="search"></i><span class="q grow">prov<span class="caret"></span></span><i data-i="x" class="sm"></i></div>
      <div class="label" style="margin-top:20px">In pi</div>
      <div class="list" style="margin-top:4px">
        <div class="item one"><i data-i="folder" class="muted"></i><div class="grow" style="min-width:0"><div class="ell"><mark>prov</mark>iders</div><div class="meta ell">packages/ai/src</div></div><span class="btn sm quiet" style="padding:0 8px">Use</span></div>
        <div class="item one"><i data-i="file" class="faint"></i><div class="grow" style="min-width:0"><div class="ell secondary"><mark>prov</mark>ider-registry.ts</div><div class="meta ell">packages/ai/src</div></div></div>
        <div class="item one"><i data-i="file" class="faint"></i><div class="grow" style="min-width:0"><div class="ell secondary"><mark>prov</mark>iders.test.ts</div><div class="meta ell">packages/ai/test</div></div></div>
      </div>
      <div class="hair" style="margin:8px calc(-1 * var(--g)) 0"></div>
      <div class="item one" style="color:var(--accent)"><i data-i="chev-r"></i><span class="grow strong" style="font-size:14px">Type ~ or / to go to a path</span></div>
    </div>
  </main>
  <div class="kb" data-kb="prov,provider,provide"></div>
</div>
<script src="../frag.js"></script><script src="../../next4/next4.js"></script>
</body></html>
