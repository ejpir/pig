<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>02 Inside a project</title>
<link rel="stylesheet" href="../../next4/next4.css"><link rel="stylesheet" href="../projects.css"></head>
<body>
<div class="phone">
  <main class="content" data-under="home">
    <div class="sheet" style="top:40px;padding-bottom:0">
      <div class="handle"></div>
      <div class="row">
        <div class="grow"><div class="t4">Projects</div><div class="meta" style="margin-top:4px">on studio-mac</div></div>
        <span class="tap" style="margin-right:-12px"><i data-i="x"></i></span>
      </div>
      <div class="search" style="margin-top:16px"><i data-i="search"></i>Find in pi, or type a path</div>
      <div class="col" style="flex:1;min-height:0;overflow:hidden">
        <div class="row" style="margin-top:12px">
          <div class="crumbs grow"><span>~</span><i data-i="chev-r"></i><span>repos</span><i data-i="chev-r"></i><span class="here">pi</span></div>
          <span class="chip sm"><i data-i="eye"></i>Hidden</span>
        </div>
        <div class="tree">
          <div class="node project picked"><span class="roll"><i data-i="chev-d"></i></span><i data-i="folder"></i><span class="name">pi</span><span class="tag">git</span></div>
          <div class="node" style="--d:1"><span class="guide" style="left:16px"></span><span class="roll"><i data-i="chev-r"></i></span><i data-i="folder"></i><span class="name">apps</span></div>
          <div class="node" style="--d:1"><span class="guide" style="left:16px"></span><span class="roll"><i data-i="chev-d"></i></span><i data-i="folder"></i><span class="name">packages</span></div>
          <div class="node" style="--d:2"><span class="guide" style="left:16px"></span><span class="guide" style="left:36px"></span><span class="roll"><i data-i="chev-d"></i></span><i data-i="folder"></i><span class="name">ai</span><span class="tag">package</span></div>
          <div class="node" style="--d:3"><span class="guide" style="left:16px"></span><span class="guide" style="left:36px"></span><span class="guide" style="left:56px"></span><span class="roll"><i data-i="chev-d"></i></span><i data-i="folder"></i><span class="name">src</span></div>
          <div class="node" style="--d:4"><span class="guide" style="left:16px"></span><span class="guide" style="left:36px"></span><span class="guide" style="left:56px"></span><span class="guide" style="left:76px"></span><span class="roll"><i data-i="chev-r"></i></span><i data-i="folder"></i><span class="name">providers</span><span class="tag">14</span></div>
          <div class="node file" style="--d:4;background:var(--selected)"><span class="guide" style="left:16px"></span><span class="guide" style="left:36px"></span><span class="guide" style="left:56px"></span><span class="guide" style="left:76px"></span><span class="roll none"></span><i data-i="file"></i><span class="name">retry.ts</span><span class="tag">2 KB</span></div>
          <div class="node file" style="--d:4"><span class="guide" style="left:16px"></span><span class="guide" style="left:36px"></span><span class="guide" style="left:56px"></span><span class="guide" style="left:76px"></span><span class="roll none"></span><i data-i="file"></i><span class="name">stream.ts</span><span class="tag">6 KB</span></div>
          <div class="node" style="--d:3"><span class="guide" style="left:16px"></span><span class="guide" style="left:36px"></span><span class="guide" style="left:56px"></span><span class="roll"><i data-i="chev-r"></i></span><i data-i="folder"></i><span class="name">test</span></div>
          <div class="node file" style="--d:3"><span class="guide" style="left:16px"></span><span class="guide" style="left:36px"></span><span class="guide" style="left:56px"></span><span class="roll none"></span><i data-i="file"></i><span class="name">package.json</span><span class="tag">1 KB</span></div>
          <div class="node" style="--d:2"><span class="guide" style="left:16px"></span><span class="guide" style="left:36px"></span><span class="roll"><i data-i="chev-r"></i></span><i data-i="folder"></i><span class="name">coding-agent</span><span class="tag">package</span></div>
          <div class="node file" style="--d:1"><span class="guide" style="left:16px"></span><span class="roll none"></span><i data-i="file"></i><span class="name">README.md</span><span class="tag">4 KB</span></div>
        </div>
      </div>
      <div class="dock" style="margin:0 calc(-1 * var(--g));padding:12px var(--g) 12px;border-top:1px solid var(--line)">
        <span class="btn primary wide"><i data-i="plus"></i>New session in pi</span>
      </div>
    </div>
  </main>
</div>
<script src="../frag.js"></script><script src="../../next4/next4.js"></script>
</body></html>
