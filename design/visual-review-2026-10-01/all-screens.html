<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pi Desktop — all 18 proposed screens</title><style>
@font-face{font-family:Plex;src:url('../../assets/fonts/IBMPlexSans-Regular.ttf')}
*{box-sizing:border-box}body{margin:0;background:#faf9f7;color:#252f3d;font:15px/1.6 Plex,system-ui,sans-serif}
main{max-width:1800px;margin:auto;padding:32px}h1{font:italic 36px Georgia,serif}h2{font-size:17px;font-weight:500}
a{color:#4b607c;text-underline-offset:4px}a:focus-visible{outline:2px solid #81766b;outline-offset:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}figure{margin:0;min-width:0}
img{display:block;width:100%;border:1px solid #ded8d1}figcaption{font-size:13px;color:#6b645d;margin-top:8px}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
</style></head><body><main><h1>A quieter workbench — all 18 screens.</h1>
<p>These are vector design proposals, not actual app captures. Click any screen to inspect its SVG at full size.</p>
<p><a href="../desktop-streamline-study.svg">Open the complete multi-screen SVG</a> · <a href="index.html">Before / after evidence</a> · <a href="README.md">Full review</a></p>
<div class="grid"><figure><h2>01  Thread · Moonstone</h2><a href="concepts/thread-light.svg"><img src="concepts/thread-light.png" loading="lazy" alt="Proposed Thread · Moonstone"></a><figcaption>Readable text, one open-session entry, a quieter contextual inspector. <a href="concepts/thread-light.svg">SVG</a> · <a href="concepts/thread-light.png">PNG</a></figcaption></figure>
<figure><h2>02  Thread · Evening</h2><a href="concepts/thread-dark.svg"><img src="concepts/thread-dark.png" loading="lazy" alt="Proposed Thread · Evening"></a><figcaption>Neutral selection and stronger secondary text; keep the ink-blue surfaces. <a href="concepts/thread-dark.svg">SVG</a> · <a href="concepts/thread-dark.png">PNG</a></figcaption></figure>
<figure><h2>03  Thread · wide window</h2><a href="concepts/thread-wide.svg"><img src="concepts/thread-wide.png" loading="lazy" alt="Proposed Thread · wide window"></a><figcaption>1600 × 900. Fluid tools/composer, readable prose. Edit explicitly expanded, not opened by resizing. <a href="concepts/thread-wide.svg">SVG</a> · <a href="concepts/thread-wide.png">PNG</a></figcaption></figure>
<figure><h2>04  Start a conversation</h2><a href="concepts/idle.svg"><img src="concepts/idle.png" loading="lazy" alt="Proposed Start a conversation"></a><figcaption>The same fluid composer and 24px gutters. Lead with the prompt, not project metadata. <a href="concepts/idle.svg">SVG</a> · <a href="concepts/idle.png">PNG</a></figcaption></figure>
<figure><h2>05  Global search · results</h2><a href="concepts/search.svg"><img src="concepts/search.png" loading="lazy" alt="Proposed Global search · results"></a><figcaption>A distinct global query, keyboard selection and clear scope. <a href="concepts/search.svg">SVG</a> · <a href="concepts/search.png">PNG</a></figcaption></figure>
<figure><h2>06  Global search · no matches</h2><a href="concepts/search-empty.svg"><img src="concepts/search-empty.png" loading="lazy" alt="Proposed Global search · no matches"></a><figcaption>An explicit empty state; background navigation is not filtered away. <a href="concepts/search-empty.svg">SVG</a> · <a href="concepts/search-empty.png">PNG</a></figcaption></figure>
<figure><h2>07  New Session · project folder</h2><a href="concepts/new-session.svg"><img src="concepts/new-session.png" loading="lazy" alt="Proposed New Session · project folder"></a><figcaption>Keep the compact 500px form; clarify inherited settings and active-folder overlap. <a href="concepts/new-session.svg">SVG</a> · <a href="concepts/new-session.png">PNG</a></figcaption></figure>
<figure><h2>08  New Session · worktree</h2><a href="concepts/new-worktree.svg"><img src="concepts/new-worktree.png" loading="lazy" alt="Proposed New Session · worktree"></a><figcaption>Conditional branch/path fields, no unusable option, one fixed action footer. <a href="concepts/new-worktree.svg">SVG</a> · <a href="concepts/new-worktree.png">PNG</a></figcaption></figure>
<figure><h2>09  All Sessions</h2><a href="concepts/sessions.svg"><img src="concepts/sessions.png" loading="lazy" alt="Proposed All Sessions"></a><figcaption>One primary action. Put infrequent export/share/delete operations under More. <a href="concepts/sessions.svg">SVG</a> · <a href="concepts/sessions.png">PNG</a></figcaption></figure>
<figure><h2>10  Models · selected model</h2><a href="concepts/models.svg"><img src="concepts/models.png" loading="lazy" alt="Proposed Models · selected model"></a><figcaption>Compact provider filters, legible rows, explicit current/selected/cycle states. <a href="concepts/models.svg">SVG</a> · <a href="concepts/models.png">PNG</a></figcaption></figure>
<figure><h2>11  Models · compact details drawer</h2><a href="concepts/compact-models.svg"><img src="concepts/compact-models.png" loading="lazy" alt="Proposed Models · compact details drawer"></a><figcaption>1000 × 680. Requested details overlay; actions do not disappear or squeeze the table. <a href="concepts/compact-models.svg">SVG</a> · <a href="concepts/compact-models.png">PNG</a></figcaption></figure>
<figure><h2>12  Resources · user packages</h2><a href="concepts/resources.svg"><img src="concepts/resources.png" loading="lazy" alt="Proposed Resources · user packages"></a><figcaption>Consistent scope, tabs and resource title; one place for intentional package actions. <a href="concepts/resources.svg">SVG</a> · <a href="concepts/resources.png">PNG</a></figcaption></figure>
<figure><h2>13  Resources · project trust</h2><a href="concepts/resources-trust.svg"><img src="concepts/resources-trust.png" loading="lazy" alt="Proposed Resources · project trust"></a><figcaption>One trust entry point with consequences visible; trust is not a sandbox. <a href="concepts/resources-trust.svg">SVG</a> · <a href="concepts/resources-trust.png">PNG</a></figcaption></figure>
<figure><h2>14  Settings · model &amp; thinking</h2><a href="concepts/settings.svg"><img src="concepts/settings.png" loading="lazy" alt="Proposed Settings · model &amp; thinking"></a><figcaption>Inline explanations. JSON keys and advanced settings remain available on demand. <a href="concepts/settings.svg">SVG</a> · <a href="concepts/settings.png">PNG</a></figcaption></figure>
<figure><h2>15  Settings · appearance</h2><a href="concepts/appearance-dark.svg"><img src="concepts/appearance-dark.png" loading="lazy" alt="Proposed Settings · appearance"></a><figcaption>Theme previews convey a real choice; do not add a dashboard of new settings. <a href="concepts/appearance-dark.svg">SVG</a> · <a href="concepts/appearance-dark.png">PNG</a></figcaption></figure>
<figure><h2>16  Changes · observed diff</h2><a href="concepts/changes.svg"><img src="concepts/changes.png" loading="lazy" alt="Proposed Changes · observed diff"></a><figcaption>A 200px file rail, wider diff and one action row. Missing snapshots remain explicit. <a href="concepts/changes.svg">SVG</a> · <a href="concepts/changes.png">PNG</a></figcaption></figure>
<figure><h2>17  Tree · selected branch entry</h2><a href="concepts/tree.svg"><img src="concepts/tree.png" loading="lazy" alt="Proposed Tree · selected branch entry"></a><figcaption>Keep the distinctive branch geometry; separate inspection from navigation. <a href="concepts/tree.svg">SVG</a> · <a href="concepts/tree.png">PNG</a></figcaption></figure>
<figure><h2>18  Context · usage &amp; compaction</h2><a href="concepts/context.svg"><img src="concepts/context.png" loading="lazy" alt="Proposed Context · usage &amp; compaction"></a><figcaption>Sparse bars have a sensible width. A real switch replaces an action-looking toggle. <a href="concepts/context.svg">SVG</a> · <a href="concepts/context.png">PNG</a></figcaption></figure></div></main></body></html>
