<rect x="807" y="1014" width="72" height="27" rx="5" fill="#4b607c"/>
<text x="821" y="1033" font-family="IBM Plex Sans" font-size="12" font-weight="600" fill="#ffffff">Send ↵</text>
<text x="176" y="1080" font-family="CommitMonoV143" font-size="12" font-weight="400" fill="#77716a">ONE LIVE STATUS WHILE WORKING · NO REPEATED THINKING ROWS</text>
<text x="1080" y="140" font-family="CommitMonoV143" font-size="12" font-weight="400" fill="#77716a">ON DEMAND / EXPANDED ACTIVITY</text>
<rect x="1080" y="164" width="488" height="379" rx="8" fill="#faf9f7" stroke="#cbc3bb"/>
<text x="1100" y="194" font-family="IBM Plex Sans" font-size="14" font-weight="400" fill="#77716a">⌄  4 tool calls · complete</text>
<rect x="1100" y="211" width="448" height="1" rx="0" fill="#e3ddd7"/>
<text x="1100" y="240" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#77716a">Edit</text>
<text x="1160" y="240" font-family="CommitMonoV143" font-size="11" font-weight="400" fill="#252f3d">…/andromeda-operator-dashboard.json</text>
<text x="1490" y="264" font-family="CommitMonoV143" font-size="11" font-weight="400" fill="#2e8a55">+2 −2</text>
<text x="1100" y="298" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#77716a">⌄ Bash</text>
<text x="1160" y="298" font-family="CommitMonoV143" font-size="12" font-weight="400" fill="#252f3d">npm run test:snapshot …</text>
<text x="1531" y="298" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#2e8a55">✓</text>
<rect x="1100" y="314" width="448" height="70" rx="4" fill="#eef0f2"/>
<text x="1112" y="339" font-family="CommitMonoV143" font-size="12" font-weight="400" fill="#252f3d">npm run test:snapshot -- -u --runInBand</text>
<text x="1112" y="361" font-family="CommitMonoV143" font-size="12" font-weight="400" fill="#252f3d">&amp;&amp; npm run test:snapshot -- --runInBand</text>
<text x="1100" y="416" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#77716a">Bash</text>
<text x="1160" y="416" font-family="CommitMonoV143" font-size="11" font-weight="400" fill="#252f3d">git diff --check &amp;&amp; git status --short</text>
<text x="1531" y="416" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#2e8a55">✓</text>
