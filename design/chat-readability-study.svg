<text x="1531" y="451" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#2e8a55">✓</text>
<rect x="1100" y="473" width="448" height="1" rx="0" fill="#e3ddd7"/>
<text x="1100" y="503" font-family="IBM Plex Sans" font-size="12" font-weight="400" fill="#77716a">Original calls and output remain selectable and copyable.</text>
<text x="1100" y="523" font-family="IBM Plex Sans" font-size="12" font-weight="400" fill="#77716a">Thinking disclosures live here, not between every call.</text>
<text x="1080" y="594" font-family="IBM Plex Sans" font-size="21" font-weight="600" fill="#252f3d">Why this is easier to scan</text>
<text x="1080" y="639" font-family="CommitMonoV143" font-size="12" font-weight="400" fill="#77716a">01</text>
<text x="1120" y="639" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#252f3d">A bounded reading column</text>
<text x="1120" y="665" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#77716a">The window can be wide; the prose does not have to be.</text>
<text x="1120" y="687" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#77716a">Keep text, tools and composer on the same 720px lane.</text>
<text x="1080" y="746" font-family="CommitMonoV143" font-size="12" font-weight="400" fill="#77716a">02</text>
<text x="1120" y="746" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#252f3d">Answers outweigh machinery</text>
<text x="1120" y="772" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#77716a">Completed activity becomes one quiet disclosure.</text>
<text x="1120" y="794" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#77716a">Keep live progress visible; do not hide errors.</text>
<text x="1080" y="853" font-family="CommitMonoV143" font-size="12" font-weight="400" fill="#77716a">03</text>
<text x="1120" y="853" font-family="IBM Plex Sans" font-size="16" font-weight="600" fill="#252f3d">Space creates a turn boundary</text>
<text x="1120" y="879" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#77716a">More breathing room before each new user message.</text>
<text x="1120" y="901" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#77716a">No assistant cards, badges or extra visual containers.</text>
<rect x="1080" y="962" width="488" height="1" rx="0" fill="#e3ddd7"/>
<text x="1080" y="992" font-family="IBM Plex Sans" font-size="15" font-weight="600" fill="#252f3d">No AI rewriting or inferred summaries.</text>
<text x="1080" y="1018" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#77716a">Preserve message text and chronology. Group only adjacent</text>
<text x="1080" y="1040" font-family="IBM Plex Sans" font-size="13" font-weight="400" fill="#77716a">tool/thinking events; intermediate explanations stay visible.</text>
<text x="32" y="1114" font-family="CommitMonoV143" font-size="12" font-weight="400" fill="#77716a">LAYOUT STUDY ONLY · CONTENT FROM YOUR SCREENSHOT · ACTIVE STATE IS ILLUSTRATIVE</text>
</svg>
