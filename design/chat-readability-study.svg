<text x="32" y="69" font-family="IBM Plex Sans" font-size="30" font-weight="600" fill="#252f3d">Let the answers lead.</text>
<text x="32" y="94" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#77716a">Your screenshot’s content, with quieter activity and a comfortable reading width.</text>
