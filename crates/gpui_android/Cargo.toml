[package]
name = "gpui_android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A GPUI platform for Android: activity lifecycle, a wgpu (Vulkan) window, touch and keyboard input."

[lib]
path = "src/gpui_android.rs"

# The demo app: GpuiActivity loads `libtouch.so` and calls its `android_main`.
# Build the APK with scripts/build_apk.py.
[[example]]
name = "touch"
path = "examples/touch/main.rs"
crate-type = ["cdylib"]

[dependencies]
anyhow.workspace = true
gpui.workspace = true
log = "0.4"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
qrcode = { version = "0.14", default-features = false }
quircs = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
gpui_wgpu = { path = "../../../zed/crates/gpui_wgpu" }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
libc = "0.2"
futures = "0.3"
jni = "0.22"
memmap2 = "0.9"
ndk = { version = "0.9", features = ["rwh_06", "nativewindow"] }
ndk-sys = "0.6"
quircs = "0.10"
raw-window-handle = "0.6"
uuid = "1"
