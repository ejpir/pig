[package]
name = "pi_android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pi on an Android phone: follow sessions, answer questions, review changes and start work."

[features]
# Deterministic sample screens for the separate device-test APK.
ui-test = ["pi_visual_ui/ui-test"]
# Experimental provider accounts and backend fixture in a separate APK; never a production default.
# The offline fixture additionally requires Android FLAG_DEBUGGABLE at runtime.
quickjs-backend-test = ["ui-test", "dep:pi-quickjs-backend-poc"]
bun-backend-test = ["quickjs-backend-test", "pi-quickjs-backend-poc/bun"]

# The cdylib is what GpuiActivity loads (`libpi_android.so`); build the APK with
# scripts/build_apk.py. The views compile on any host for tests and previews.
[lib]
path = "src/pi_android.rs"
crate-type = ["rlib", "cdylib"]

[[example]]
name = "preview"
path = "examples/preview.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
async-channel.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
gpui.workspace = true
gpui_android = { path = "../gpui_android" }
libc = "0.2"
log = "0.4"
pi_core = { path = "../pi_core" }
pi-quickjs-backend-poc = { path = "../../experiments/quickjs-backend", optional = true }
pi_markdown = { path = "../pi_markdown" }
pi_visual = { path = "../pi_visual" }
pi_visual_ui = { path = "../pi_visual_ui", features = ["android"] }
# The SSH key; the same rand as russh's ssh-key.
rand = "0.10"
# SSH in pure Rust, with ring for its crypto: it builds for Android with the NDK alone.
russh = { version = "0.64", default-features = false, features = ["ring", "flate2"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
semver = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
unicode-segmentation = "1.12"

[dev-dependencies]
pi_visual_ui = { path = "../pi_visual_ui", features = ["android", "test-support"] }
gpui = { workspace = true, features = ["test-support"] }

# The preview window. Runtime shaders, as in pi_desktop: a Mac needs no Xcode `metal` tool.
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
gpui_platform = { workspace = true, features = ["runtime_shaders"] }
